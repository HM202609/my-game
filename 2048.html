<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 数字拼图</title>
<style>
  :root{
    --bg-1:#fdf6ec;
    --bg-2:#f2e7d4;
    --board-bg:#bbada0;
    --cell-bg:rgba(238,228,218,.35);
    --text:#776e65;
    --text-strong:#3c3a32;
    --accent:#edc22e;
    --shadow:0 12px 30px rgba(120,90,50,.18);
    --radius:14px;
    --pad:12px;
    --gap:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 620px at 12% -12%, #fffdf8 0%, rgba(255,253,248,0) 62%),
      linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .app{width:100%;max-width:470px;}

  /* ---------- 标题 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .title{
    font-size:56px;line-height:1;font-weight:800;letter-spacing:2px;
    color:var(--text-strong);text-shadow:0 2px 0 rgba(255,255,255,.65);
  }
  .title span{color:var(--accent);}
  .subtitle{margin-top:8px;font-size:13px;color:#a99f92;}
  .badge{
    font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap;
    background:rgba(237,194,46,.2);color:#a8842a;font-weight:700;
  }

  /* ---------- 分数条 ---------- */
  .scorebar{display:flex;gap:10px;margin-bottom:14px;align-items:stretch;}
  .score-card{
    flex:1;min-width:0;background:rgba(255,255,255,.74);
    border:1px solid rgba(187,173,160,.32);border-radius:var(--radius);
    padding:10px 14px;box-shadow:var(--shadow);backdrop-filter:blur(6px);
  }
  .score-card .label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a99f92;font-weight:700;}
  .score-card .value{font-size:25px;font-weight:800;color:var(--text-strong);line-height:1.25;font-variant-numeric:tabular-nums;}
  .score-card .value.bump{animation:bump .35s ease;}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
  .best{color:#a8842a;}
  .actions{display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:10px;color:var(--text-strong);white-space:nowrap;
    background:rgba(255,255,255,.85);border:1px solid rgba(187,173,160,.4);
    box-shadow:0 2px 0 rgba(187,173,160,.5);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease,opacity .12s ease;
  }
  .btn:hover{background:#fff;}
  .btn:active{transform:translateY(2px);box-shadow:none;}
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:0 2px 0 rgba(187,173,160,.5);}
  .btn.primary{background:var(--accent);color:#fff;border-color:#d9ae1c;box-shadow:0 2px 0 #d9ae1c;}

  /* ---------- 棋盘 ---------- */
  .board{
    position:relative;width:100%;aspect-ratio:1/1;
    background:var(--board-bg);border-radius:var(--radius);
    padding:var(--pad);box-shadow:var(--shadow);
    touch-action:none;user-select:none;
  }
  .grid{
    position:absolute;inset:var(--pad);
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap);
  }
  .cell{background:var(--cell-bg);border-radius:10px;}
  .layer{position:absolute;inset:var(--pad);pointer-events:none;}

  .tile{
    position:absolute;top:0;left:0;
    transition:transform .12s ease-in-out;will-change:transform;
  }
  .box{
    width:100%;height:100%;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;letter-spacing:-1px;color:#776e65;background:#eee4da;
    transition:background .15s ease;
  }
  .box.new{animation:pop .2s ease-out;}
  .box.pop{animation:pop .2s ease-out;}
  .box.dead{opacity:0;transform:scale(.55);transition:transform .12s ease-in,opacity .12s ease-in;}
  @keyframes pop{0%{transform:scale(.35)}60%{transform:scale(1.09)}100%{transform:scale(1)}}
  .v-2{background:#eee4da;}
  .v-4{background:#ede0c8;}
  .v-8{background:#f2b179;color:#f9f6f2;}
  .v-16{background:#f59563;color:#f9f6f2;}
  .v-32{background:#f67c5f;color:#f9f6f2;}
  .v-64{background:#f65e3b;color:#f9f6f2;}
  .v-128{background:#edcf72;color:#f9f6f2;}
  .v-256{background:#edcc61;color:#f9f6f2;}
  .v-512{background:#edc850;color:#f9f6f2;}
  .v-1024{background:#edc53f;color:#f9f6f2;}
  .v-2048{background:#edc22e;color:#f9f6f2;box-shadow:0 0 18px rgba(237,194,46,.85);}
  .v-super{background:linear-gradient(135deg,#3c3a32,#5a564c);color:#f9f6f2;box-shadow:0 0 20px rgba(60,58,50,.55);}

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute;inset:0;border-radius:var(--radius);z-index:5;
    background:rgba(238,228,218,.82);backdrop-filter:blur(4px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:18px;overflow-y:auto;
  }
  .overlay.show{display:flex;animation:fade .22s ease-out;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .ov-card{width:100%;max-width:320px;margin:auto;display:flex;flex-direction:column;align-items:center;}
  .ov-media{
    width:100%;display:flex;justify-content:center;margin-bottom:14px;
    animation:mediaIn .38s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes mediaIn{0%{opacity:0;transform:scale(.6) translateY(10px)}100%{opacity:1;transform:none}}
  .ov-media img{display:block;height:auto;}
  .ov-media.win img{
    max-width:168px;max-height:168px;object-fit:contain;
    padding:9px;background:#fff;border-radius:16px;
    box-shadow:0 8px 20px rgba(120,90,50,.22);
  }
  .ov-media.lose img{
    max-width:100%;max-height:172px;object-fit:contain;border-radius:12px;
    box-shadow:0 8px 22px rgba(90,30,20,.35);
  }
  .overlay h2{margin:0 0 8px;font-size:28px;color:var(--text-strong);}
  .overlay p{margin:0 0 18px;font-size:14px;color:#8d8378;line-height:1.75;max-width:290px;}
  .overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* ---------- 方向键 ---------- */
  .controls{
    display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,50px);
    gap:8px;justify-content:center;margin-top:22px;
  }
  .ctrl{
    border:none;cursor:pointer;border-radius:12px;font-size:19px;color:var(--text-strong);
    background:rgba(255,255,255,.85);border:1px solid rgba(187,173,160,.45);
    box-shadow:0 2px 0 rgba(187,173,160,.55);
    transition:transform .1s ease,box-shadow .1s ease,background .1s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .ctrl:hover{background:#fff;}
  .ctrl:active{transform:translateY(2px);box-shadow:none;background:#f6efe4;}
  .ctrl.up{grid-area:1/2;} .ctrl.left{grid-area:2/1;} .ctrl.down{grid-area:2/2;} .ctrl.right{grid-area:2/3;}

  .hint{margin-top:18px;text-align:center;font-size:12px;color:#a99f92;line-height:1.9;}
  .hint kbd{
    display:inline-block;padding:1px 6px;margin:0 2px;border-radius:5px;background:#fff;
    border:1px solid rgba(187,173,160,.5);box-shadow:0 1px 0 rgba(187,173,160,.5);
    font-family:inherit;font-size:11px;color:#8d8378;
  }
  @media (max-width:420px){
    .title{font-size:42px;}
    .controls{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,46px);}
    .ov-media.win img{max-width:126px;max-height:126px;}
    .ov-media.lose img{max-height:130px;}
    .overlay h2{font-size:24px;}
    .overlay p{font-size:13px;margin-bottom:14px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="title">2<span>0</span>48</div>
      <div class="subtitle">合并相同数字，一路冲击 2048</div>
    </div>
    <div class="badge">纯前端 · 离线可玩</div>
  </header>

  <div class="scorebar">
    <div class="score-card">
      <div class="label">得分</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-card">
      <div class="label">最高</div>
      <div class="value best" id="best">0</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="newBtn" title="重新开始 (R)">新局</button>
      <button class="btn" id="undoBtn" title="撤销上一步 (Z)">撤销</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="layer" id="layer"></div>
    <div class="overlay" id="overlay">
      <div class="ov-card">
        <div class="ov-media" id="ovMedia"></div>
        <h2 id="ovTitle">游戏结束</h2>
        <p id="ovText"></p>
        <div class="row" id="ovBtns"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl up"    data-dir="up"    aria-label="向上">&#9650;</button>
    <button class="ctrl left"  data-dir="left"  aria-label="向左">&#9664;</button>
    <button class="ctrl down"  data-dir="down"  aria-label="向下">&#9660;</button>
    <button class="ctrl right" data-dir="right" aria-label="向右">&#9654;</button>
  </div>

  <p class="hint">
    按 <kbd>&#8592;</kbd><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8594;</kbd> 或在棋盘上滑动方向即可移动方块<br>
    <kbd>R</kbd> 重新开始 &nbsp;·&nbsp; <kbd>Z</kbd> 撤销上一步
  </p>
</div>

<script>
(function(){
  "use strict";

  var SIZE = 4;
  var VEC = { left:[0,-1], right:[0,1], up:[-1,0], down:[1,0] };
  var PAD = 12, GAP = 12;

  var boardEl = document.getElementById('board');
  var layerEl = document.getElementById('layer');
  var gridEl  = document.getElementById('grid');
  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText  = document.getElementById('ovText');
  var ovBtns  = document.getElementById('ovBtns');
  var ovMedia = document.getElementById('ovMedia');
  var undoBtn = document.getElementById('undoBtn');
  var newBtn  = document.getElementById('newBtn');

  var grid = [];      // grid[r][c] -> tile | null
  var tiles = [];     // 全部 tile
  var score = 0, best = 0, uid = 0;
  var over = false, won = false, keepGoing = false;
  var history = [];
  var busy = false;
  var cellSize = 100;
  var gainedLast = 0;

  /* ================= 存储 ================= */
  function loadBest(){
    try { return parseInt(localStorage.getItem('best2048') || '0', 10) || 0; } catch(e){ return 0; }
  }
  function saveBest(){
    try { localStorage.setItem('best2048', String(best)); } catch(e){}
  }

  /* ================= 棋盘构建 ================= */
  (function buildCells(){
    var html = '';
    for (var i = 0; i < SIZE * SIZE; i++) html += '<div class="cell"></div>';
    gridEl.innerHTML = html;
  })();

  function makeTile(r, c, v, isNew){
    var el   = document.createElement('div');
    var box  = document.createElement('div');
    el.className = 'tile';
    box.className = 'box' + (isNew ? ' new' : '') + ' v-' + v;
    box.textContent = v;
    el.appendChild(box);
    layerEl.appendChild(el);
    var t = { id:++uid, r:r, c:c, v:v, el:el, box:box, dying:false, pop:false, merged:false };
    tiles.push(t);
    return t;
  }

  function resetBoard(){
    layerEl.innerHTML = '';
    tiles = [];
    grid = [];
    for (var r = 0; r < SIZE; r++) grid.push(new Array(SIZE).fill(null));
    score = 0; over = false; won = false; keepGoing = false; history = [];
  }

  function newGame(){
    resetBoard();
    addTile();
    addTile();
    gainedLast = 0;
    syncScore(false);
    hideOverlay();
    undoBtn.disabled = true;
    layout();
  }

  function addTile(){
    var empty = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return null;
    var p = empty[(Math.random() * empty.length) | 0];
    var t = makeTile(p[0], p[1], Math.random() < 0.9 ? 2 : 4, true);
    grid[p[0]][p[1]] = t;
    return t;
  }

  /* ================= 布局 ================= */
  function layout(){
    var inner = boardEl.clientWidth - PAD * 2;          // layer 实际宽度
    var cell = (inner - GAP * (SIZE - 1)) / SIZE;
    cellSize = cell;
    for (var i = 0; i < tiles.length; i++){
      var t = tiles[i];
      t.el.style.width  = cell + 'px';
      t.el.style.height = cell + 'px';
      t.box.style.fontSize = fontSize(t.v, cell) + 'px';
      t.el.style.transform = 'translate(' + (t.c * (cell + GAP)) + 'px,' + (t.r * (cell + GAP)) + 'px)';
    }
  }

  function fontSize(v, cell){
    var len = String(v).length;
    var ratio = len <= 2 ? 0.44 : (len === 3 ? 0.34 : 0.26);
    return Math.max(11, Math.round(cell * ratio));
  }

  /* ================= 数值同步 ================= */
  function syncTiles(){
    for (var i = 0; i < tiles.length; i++){
      var t = tiles[i];
      if (t.dying) continue;
      var box = t.box;
      if (box.dataset.v !== String(t.v)){
        box.dataset.v = String(t.v);
        box.textContent = t.v;
        var cls = box.className.split(/\s+/);
        for (var j = 0; j < cls.length; j++){
          if (cls[j].indexOf('v-') === 0 && cls[j] !== 'v-' + t.v) box.classList.remove(cls[j]);
        }
        box.classList.add('v-' + t.v);
        if (t.v > 2048) box.classList.add('v-super');
        box.style.fontSize = fontSize(t.v, cellSize) + 'px';
      }
      if (t.pop){
        t.pop = false;
        box.classList.remove('pop');
        void box.offsetWidth;
        box.classList.add('pop');
      }
    }
  }

  /* ================= 撤销快照 ================= */
  function snapshot(){
    var list = [];
    for (var i = 0; i < tiles.length; i++){
      var t = tiles[i];
      list.push({ id:t.id, r:t.r, c:t.c, v:t.v });
    }
    return { score:score, tiles:list };
  }

  function restore(snap){
    layerEl.innerHTML = '';
    tiles = [];
    grid = [];
    for (var r = 0; r < SIZE; r++) grid.push(new Array(SIZE).fill(null));
    score = snap.score;
    for (var i = 0; i < snap.tiles.length; i++){
      var s = snap.tiles[i];
      var t = makeTile(s.r, s.c, s.v, false);
      t.id = s.id;
      grid[s.r][s.c] = t;
    }
    over = false; won = false; keepGoing = false;
    gainedLast = 0;
    syncScore(false);
    hideOverlay();
    layout();
  }

  /* ================= 移动 ================= */
  function orderCells(dir){
    var cells = [], r, c;
    if (dir === 'left')       { for (r = 0; r < SIZE; r++) for (c = 0; c < SIZE; c++) cells.push([r,c]); }
    else if (dir === 'right') { for (r = 0; r < SIZE; r++) for (c = SIZE-1; c >= 0; c--) cells.push([r,c]); }
    else if (dir === 'up')    { for (c = 0; c < SIZE; c++) for (r = 0; r < SIZE; r++) cells.push([r,c]); }
    else                      { for (c = 0; c < SIZE; c++) for (r = SIZE-1; r >= 0; r--) cells.push([r,c]); }
    return cells;
  }

  function rebuildGrid(){
    for (var i = 0; i < SIZE; i++) grid[i].fill(null);
    for (var i = 0; i < tiles.length; i++){
      var tt = tiles[i];
      if (!tt.dying) grid[tt.r][tt.c] = tt;
    }
  }

  function move(dir){
    if (over || busy) return;

    var preSnap = snapshot();
    var vec = VEC[dir], dr = vec[0], dc = vec[1];
    var cells = orderCells(dir);
    var occupied = Object.create(null);
    var gained = 0, changed = false, deaths = [];
    var i, r, c;

    for (i = 0; i < tiles.length; i++) tiles[i].merged = false;

    for (i = 0; i < cells.length; i++){
      r = cells[i][0]; c = cells[i][1];
      var t = grid[r][c];
      if (!t) continue;
      grid[r][c] = null;

      var nr = r, nc = c, blocker = null;
      while (true){
        var tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        var k = tr + ',' + tc;
        if (occupied[k]){ blocker = occupied[k]; break; }
        nr = tr; nc = tc;
      }

      if (blocker && blocker.v === t.v && !blocker.merged){
        // 合并：被合并方滑向目标格后淡出
        blocker.v *= 2;
        blocker.merged = true;
        blocker.pop = true;
        gained += blocker.v;
        t.r = blocker.r; t.c = blocker.c;
        t.dying = true;
        deaths.push(t);
        changed = true;
      } else {
        occupied[nr + ',' + nc] = t;
        t.r = nr; t.c = nc;
        if (nr !== r || nc !== c) changed = true;
      }
    }

    if (!changed){
      // 该方向无法移动：还原棋盘映射并复核局面（棋盘已满时触发结束判定）
      rebuildGrid();
      checkState();
      return;
    }

    history.push(preSnap);
    if (history.length > 30) history.shift();
    undoBtn.disabled = false;

    rebuildGrid();

    gainedLast = gained;
    score += gained;
    syncScore(true);

    busy = true;
    layout();      // 先移动到新位置（触发过渡）
    syncTiles();   // 再更新数值与合并特效
    layout();

    for (i = 0; i < deaths.length; i++){
      (function(d){
        d.box.classList.add('dead');
        setTimeout(function(){
          if (d.el.parentNode) d.el.parentNode.removeChild(d.el);
          var idx = tiles.indexOf(d);
          if (idx > -1) tiles.splice(idx, 1);
        }, 130);
      })(deaths[i]);
    }

    setTimeout(function(){
      addTile();
      syncTiles();
      layout();
      busy = false;
      checkState();
    }, 130);

  /* ================= 状态判定 ================= */
  function canMove(){
    for (var r = 0; r < SIZE; r++){
      for (var c = 0; c < SIZE; c++){
        if (!grid[r][c]) return true;
        if (c + 1 < SIZE && grid[r][c+1] && grid[r][c].v === grid[r][c+1].v) return true;
        if (r + 1 < SIZE && grid[r+1][c] && grid[r][c].v === grid[r+1][c].v) return true;
      }
    }
    return false;
  }

  function checkState(){
    var has2048 = false;
    for (var i = 0; i < tiles.length; i++) if (tiles[i].v === 2048) has2048 = true;

    if (has2048 && !won && !keepGoing){
      won = true;
      showOverlay('🎉 通关啦！', '成功合成了 2048，最终得分 ' + score + '。送你一朵花花，继续冲更大的数字吧！', [
        { text:'继续游戏', cls:'btn primary', fn:function(){ keepGoing = true; hideOverlay(); } },
        { text:'再来一局', cls:'btn', fn:newGame }
      ], { src:IMG_WIN, alt:'送你花花', kind:'win' });
      return;
    }
    if (!canMove()){
      over = true;
      showOverlay('游戏结束', '本次得分 ' + score + '，最高分 ' + best + '。胜败乃兵家常事也，大侠请重新来过吧！', [
        { text:'重新开始', cls:'btn primary', fn:newGame }
      ], { src:IMG_LOSE, alt:'胜败乃兵家常事也，大侠请重新来过吧', kind:'lose' });
    }
  }

  function showOverlay(title, text, buttons, media){
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtns.innerHTML = '';
    ovMedia.innerHTML = '';
    ovMedia.className = 'ov-media';
    if (media){
      var img = document.createElement('img');
      img.src = media.src;
      img.alt = media.alt;
      ovMedia.appendChild(img);
      ovMedia.classList.add(media.kind);
    }
    for (var i = 0; i < buttons.length; i++){
      var b = document.createElement('button');
      b.className = buttons[i].cls;
      b.textContent = buttons[i].text;
      b.onclick = buttons[i].fn;
      ovBtns.appendChild(b);
    }
    overlay.classList.add('show');
  }
  function hideOverlay(){
    overlay.classList.remove('show');
    ovMedia.innerHTML = '';
    ovMedia.className = 'ov-media';
  }

  /* ================= 分数 ================= */
  function syncScore(bump){
    if (score > best){ best = score; saveBest(); }
    scoreEl.textContent = score;
    bestEl.textContent = best;
    if (bump && gainedLast > 0){
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
    }
  }

  /* ================= 撤销 ================= */
  function undo(){
    if (!history.length || busy) return;
    var snap = history.pop();
    if (snap) restore(snap);
    undoBtn.disabled = history.length === 0;
  }

  /* ================= 交互 ================= */
  var KEYMAP = {
    ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
    a:'left', d:'right', w:'up', s:'down', A:'left', D:'right', W:'up', S:'down'
  };
  document.addEventListener('keydown', function(e){
    if (e.key in KEYMAP){ e.preventDefault(); move(KEYMAP[e.key]); }
    else if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); newGame(); }
    else if (e.key === 'z' || e.key === 'Z'){ e.preventDefault(); undo(); }
  });

  var ctrlBtns = document.querySelectorAll('.ctrl');
  for (var k = 0; k < ctrlBtns.length; k++){
    ctrlBtns[k].addEventListener('click', function(){ move(this.getAttribute('data-dir')); });
  }
  newBtn.addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);

  // 触屏滑动
  var tsx = 0, tsy = 0, tst = 0;
  boardEl.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    tsx = t.clientX; tsy = t.clientY; tst = Date.now();
  }, { passive:true });
  boardEl.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Date.now() - tst > 800) return;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive:true });

  // 鼠标拖拽
  var mdown = false, mdx = 0, mdy = 0;
  boardEl.addEventListener('mousedown', function(e){ mdown = true; mdx = e.clientX; mdy = e.clientY; });
  window.addEventListener('mouseup', function(e){
    if (!mdown) return;
    mdown = false;
    var dx = e.clientX - mdx, dy = e.clientY - mdy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  });

  var rzTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(layout, 80);
  });

  /* ================= 启动 ================= */
  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
